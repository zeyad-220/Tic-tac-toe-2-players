<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#150d2b">
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150d2b;--bg2:#2a1659;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);
  --text:#f5f0ff;--muted:#a99dcb;--x:#ff5d73;--o:#3ee6d0;--gold:#ffc857;
  --tile:#33206a;--tile2:#1f1347;--shadow:rgba(5,0,20,.6);
  --r:22px;
}
[data-theme=light]{
  --bg:#f4efff;--bg2:#dccfff;--panel:rgba(255,255,255,.7);--line:rgba(60,30,120,.14);
  --text:#26124f;--muted:#6c5f8f;--x:#e63950;--o:#0aa896;--gold:#e69b00;
  --tile:#fff;--tile2:#ebe3ff;--shadow:rgba(70,40,140,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh;font-family:Tajawal,Tahoma,sans-serif;font-weight:500;color:var(--text);
  background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  transition:background .4s,color .4s;
}
body::before,body::after{
  content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.55;
  animation:drift 18s ease-in-out infinite alternate;
}
body::before{background:radial-gradient(circle,var(--bg2),transparent 65%);top:-25vmax;right:-15vmax}
body::after{background:radial-gradient(circle,color-mix(in srgb,var(--x) 40%,transparent),transparent 65%);bottom:-30vmax;left:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.app{width:min(100%,440px);padding:20px 18px 12px;display:flex;flex-direction:column;gap:16px;flex:1}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-family:Lalezar,Tajawal,sans-serif;font-size:2.6rem;font-weight:400;line-height:1;
  background:linear-gradient(100deg,var(--x),var(--gold) 50%,var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--x) 45%,transparent))}
.tools{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.icon{width:42px;height:42px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);font-size:1.15rem;box-shadow:0 6px 16px -6px var(--shadow);transition:transform .2s}
.icon:hover{transform:translateY(-2px) rotate(-6deg)}.icon:active{transform:scale(.9)}

.seg{display:flex;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);position:relative}
.seg button{flex:1;padding:10px 8px;border-radius:12px;color:var(--muted);transition:color .25s,background .25s,box-shadow .25s}
.seg button[aria-pressed=true]{color:var(--text);background:linear-gradient(145deg,var(--tile),var(--tile2));box-shadow:0 6px 14px -6px var(--shadow),inset 0 1px 0 rgba(255,255,255,.15)}
.seg.small{font-size:.9rem;transition:opacity .3s,max-height .3s,margin .3s;max-height:60px}
.seg.small.hide{opacity:0;max-height:0;padding:0;border:0;pointer-events:none;margin-top:-16px;overflow:hidden}

.scores{display:grid;grid-template-columns:1fr .8fr 1fr;gap:10px}
.sc{padding:12px 8px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);
  text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 24px -14px var(--shadow);transition:transform .3s,border-color .3s,box-shadow .3s}
.sc .who{font-size:.85rem;color:var(--muted)}
.sc b{font-family:Lalezar,sans-serif;font-weight:400;font-size:2rem;line-height:1.1}
.sc.x b{color:var(--x)}.sc.o b{color:var(--o)}
.sc.on{transform:translateY(-4px)}
.sc.x.on{border-color:var(--x);box-shadow:0 14px 30px -12px var(--x)}
.sc.o.on{border-color:var(--o);box-shadow:0 14px 30px -12px var(--o)}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.5)}}

.turn{text-align:center;font-size:1.1rem;min-height:1.8rem;display:flex;justify-content:center;align-items:center;gap:8px}
.turn i{font-style:normal;font-family:Lalezar,sans-serif;font-size:1.5rem}
.turn.think::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.15;transform:scale(1.8)}}

.board-wrap{position:relative;width:min(100%,380px);aspect-ratio:1;margin:0 auto;perspective:900px}
.board{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px;width:100%;height:100%;
  padding:14px;border-radius:30px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);
  box-shadow:0 30px 60px -20px var(--shadow),0 2px 0 rgba(255,255,255,.08) inset;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.cell{position:relative;border-radius:18px;display:grid;place-items:center;cursor:pointer;color:var(--x);
  background:linear-gradient(145deg,var(--tile),var(--tile2));
  box-shadow:0 12px 20px -10px var(--shadow),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -4px 8px rgba(0,0,0,.18);
  transition:transform .2s,box-shadow .2s;animation:pop .55s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(20px)}}
.cell:not(.full):hover{transform:translateY(-4px);box-shadow:0 18px 26px -10px var(--shadow),inset 0 1px 0 rgba(255,255,255,.2)}
.cell:not(.full):active{transform:scale(.94)}
.cell.full{cursor:default;box-shadow:0 4px 8px -4px var(--shadow),inset 0 3px 10px rgba(0,0,0,.25)}
.board[data-turn=X] .cell:not(.full):hover::after,.board[data-turn=O] .cell:not(.full):hover::after{
  content:"X";font-family:Lalezar,sans-serif;font-size:clamp(2.2rem,12vw,3.6rem);color:var(--x);opacity:.25}
.board[data-turn=O] .cell:not(.full):hover::after{content:"O";color:var(--o)}
.board.lock .cell{pointer-events:none}
.mk{width:68%;height:68%;overflow:visible;filter:drop-shadow(0 0 10px currentColor)}
.mk.o{color:var(--o)}.mk.x{color:var(--x)}
.mk path,.mk circle{fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s ease-out forwards}
.mk path+path{animation-delay:.15s}
@keyframes draw{to{stroke-dashoffset:0}}
.cell.win{animation:glow .9s ease-in-out infinite alternate;z-index:1}
@keyframes glow{to{transform:scale(1.07);box-shadow:0 0 0 2px var(--gold),0 0 34px var(--gold)}}
.cell.dim .mk{opacity:.35;filter:none}

.strike{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.strike line{stroke:var(--gold);stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 10px var(--gold));animation:draw .5s .2s ease-out forwards}

.actions{display:flex;gap:10px;justify-content:center}
.main,.ghost{padding:12px 18px;border-radius:16px;transition:transform .2s,box-shadow .2s,opacity .2s}
.main{flex:1.4;color:#1a0d36;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--x));box-shadow:0 14px 26px -10px var(--x),inset 0 1px 0 rgba(255,255,255,.5)}
.ghost{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.main:hover,.ghost:hover:not(:disabled){transform:translateY(-3px)}
.main:active,.ghost:active{transform:scale(.95)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.hint{text-align:center;color:var(--muted);font-size:.8rem}

dialog{margin:auto;border:1px solid var(--line);border-radius:28px;padding:30px 34px;text-align:center;color:var(--text);
  background:linear-gradient(160deg,var(--tile),var(--tile2));box-shadow:0 40px 80px -20px var(--shadow);width:min(86vw,340px)}
dialog[open]{animation:dlg .5s cubic-bezier(.3,1.5,.5,1)}
dialog::backdrop{background:rgba(10,4,30,.55);backdrop-filter:blur(6px)}
@keyframes dlg{from{opacity:0;transform:scale(.6) translateY(30px)}}
.rmark{width:86px;height:86px;margin:0 auto 6px}.rmark .mk{width:100%;height:100%}
dialog h2{font-family:Lalezar,sans-serif;font-weight:400;font-size:2rem;margin-bottom:4px}
dialog p{color:var(--muted);margin-bottom:20px}
dialog .main{width:100%}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
footer{width:100%;padding:14px;text-align:center;font-size:.8rem;color:var(--muted)}

[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:16px}
.rmark svg{width:100%;height:100%}
.chips{display:grid;gap:10px}
.sc.pon{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 30px -12px var(--gold)}
.sboard{position:relative;direction:ltr;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:2px;width:100%;height:100%;padding:8px;border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 30px 60px -20px var(--shadow)}
.sq{border-radius:6px;font-size:.55rem;color:var(--muted);padding:2px 3px;background:linear-gradient(145deg,var(--tile),var(--tile2));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 6px -3px var(--shadow)}
.sq.alt{filter:brightness(1.18)}
.slayer,.tokens{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);pointer-events:none}
.slayer line,.slayer path{fill:none;stroke-linecap:round}
.lad line{stroke:var(--gold);stroke-width:.7;filter:drop-shadow(0 0 1px var(--gold))}
.snk path{stroke-width:2.2;opacity:.9}
.tok{position:absolute;width:4.4%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:currentColor;border:2px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.5),0 0 12px currentColor;transition:left .17s,top .17s;z-index:3}
.tok.jump{transition-duration:.6s}
.snlbar{display:flex;align-items:center;justify-content:center;gap:16px}
.snlbar .main{flex:0 1 200px}.snlbar .main:disabled{opacity:.5;cursor:not-allowed}
.die{width:76px;height:76px;border-radius:20px;font-family:Lalezar,sans-serif;font-size:2.6rem;color:#26124f;cursor:pointer;background:linear-gradient(145deg,#fff,#d9d0ff);box-shadow:0 14px 24px -10px var(--shadow),inset 0 -4px 8px rgba(80,50,160,.25)}
.die.roll{animation:shake .15s infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg)}}

#games button{font-size:.85rem;padding:10px 4px}
.lboard{position:relative;direction:ltr;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);width:100%;height:100%;padding:8px;border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 30px 60px -20px var(--shadow)}
.lcorn{display:grid;grid-template:1fr 1fr/1fr 1fr;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--c) 40%,var(--tile2));box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
.lcorn i{width:34%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.25);box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.lmid{background:conic-gradient(from -45deg,#4ade80 0 25%,#4aa8ff 0 50%,#ffc857 0 75%,#ff5d73 0);border-radius:10px;box-shadow:0 0 0 2px var(--line)}
.lc{display:grid;place-items:center;font-size:.6rem;color:var(--muted);background:linear-gradient(145deg,var(--tile),var(--tile2));box-shadow:inset 0 0 0 1px var(--line)}
.lc.st{background:color-mix(in srgb,var(--c) 70%,var(--tile2))}
.ltoks{position:absolute;inset:8px;pointer-events:none}
.lt{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--c);border:2px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.55);transition:left .17s,top .17s;padding:0;z-index:3}
.lt.can{pointer-events:auto;cursor:pointer;z-index:5;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 0 3px #fff,0 0 18px var(--c)}}
#setup h2{margin-bottom:0}
#setup .seg{margin-top:14px}
#srows{margin:16px 0 20px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;gap:8px;align-items:center}
.srow i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.srow input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.srow input:focus-visible{outline:2px solid var(--gold)}
.tg{padding:9px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:.8rem;white-space:nowrap}
.tg:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1 data-t="title"></h1>
    <div class="tools">
      <button class="icon" id="lang" aria-label="Language"></button>
      <button class="icon" id="sound" aria-label="Sound"></button>
      <button class="icon" id="theme" aria-label="Theme"></button>
    </div>
  </header>
  <nav class="seg" id="games">
    <button data-game="xo" data-t="xo"></button>
    <button data-game="snl" data-t="snl"></button>
    <button data-game="ludo" data-t="ludo"></button>
  </nav>

  <section class="stack" id="xoGame">
    <div class="seg" id="modes" role="group">
      <button data-mode="two" data-t="two"></button>
      <button data-mode="cpu" data-t="cpu"></button>
    </div>
    <div class="seg small" id="levels" role="group">
      <button data-level="easy" data-t="easy"></button>
      <button data-level="mid" data-t="mid"></button>
      <button data-level="hard" data-t="hard"></button>
    </div>
    <section class="scores" aria-live="polite">
      <div class="sc x" id="scX"><span class="who" id="whoX"></span><b id="nX">0</b></div>
      <div class="sc d"><span class="who" data-t="draw"></span><b id="nD">0</b></div>
      <div class="sc o" id="scO"><span class="who" id="whoO"></span><b id="nO">0</b></div>
    </section>
    <p class="turn" id="turn" aria-live="polite"></p>
    <div class="board-wrap">
      <div class="board" id="board" data-turn="X"></div>
      <svg class="strike" id="strike" aria-hidden="true"></svg>
    </div>
    <div class="actions">
      <button class="ghost" id="undo" data-t="undo"></button>
      <button class="main" id="next" data-t="next"></button>
      <button class="ghost" id="clear" data-t="clear"></button>
    </div>
    <p class="hint" data-t="hint"></p>
  </section>

  <section class="stack" id="snlGame" hidden>
    <div class="seg small" id="snlN" role="group">
      <button data-n="2"></button><button data-n="3"></button><button data-n="4"></button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="turn" id="sturn" aria-live="polite"></p>
    <div class="board-wrap"><div class="sboard" id="sboard"></div></div>
    <div class="snlbar">
      <button class="die" id="die" aria-label="Dice">?</button>
      <button class="main" id="roll"></button>
    </div>
    <p class="hint" id="smsg"></p>
    <p class="hint" id="sHint"></p>
  </section>
  <section class="stack" id="ludoGame" hidden>
    <div class="seg small" id="lN" role="group">
      <button data-ln="2"></button><button data-ln="3"></button><button data-ln="4"></button>
    </div>
    <div class="chips" id="lchips"></div>
    <p class="turn" id="lturn" aria-live="polite"></p>
    <div class="board-wrap"><div class="lboard" id="lboard"></div></div>
    <div class="snlbar">
      <button class="die" id="ldie" aria-label="Dice">?</button>
      <button class="main" id="lroll"></button>
    </div>
    <p class="hint" id="lmsg"></p>
    <p class="hint" id="lHint"></p>
  </section>
</main>

<dialog id="result">
  <div class="rmark" id="rMark"></div>
  <h2 id="rTitle"></h2>
  <p id="rSub"></p>
  <button class="main" id="again" data-t="again"></button>
</dialog>

<dialog id="setup">
  <h2 data-t="setupT"></h2>
  <div class="seg small" id="snN" role="group"><button data-sn="2"></button><button data-sn="3"></button><button data-sn="4"></button></div>
  <div id="srows"></div>
  <button class="main" id="sgo" data-t="start"></button>
</dialog>

<canvas id="fx" aria-hidden="true"></canvas>
<footer>X-O © 2025 Zeyad Gaber | All Rights Reserved</footer>
<script>
const $ = s => document.querySelector(s);
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl = $('#board'), wrap = $('.board-wrap'), strike = $('#strike'), dlg = $('#result');
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let cfg = Object.assign({ mode: 'cpu', level: 'mid', sound: true, theme: 'dark', game: 'xo', lang: 'en', names: ['', '', '', ''], cpu: [false, false, true, true] }, store.get('xo-cfg', {}));
let score = Object.assign({ X: 0, O: 0, D: 0 }, store.get('xo-score', {}));
let S = { b: Array(9).fill(''), turn: 'X', start: 'X', over: false, busy: false, hist: [] };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- language ---------- */
const L = {
  en: { title: 'Game Night', xo: 'Tic Tac Toe', snl: 'Snakes & Ladders', two: '2 Players', cpu: 'vs Computer', easy: 'Easy', mid: 'Medium', hard: 'Impossible',
    draw: 'Draw', undo: 'Undo', next: 'New round', clear: 'Reset scores', hint: 'Play with keys 1 to 9', again: 'Play again',
    you: 'You', cpuN: 'Computer', p: n => `Player ${n}`, yourTurn: 'Your turn <i>X</i>', turnP: p => `Player <i>${p}</i>'s turn`,
    think: 'Computer is thinking', over: 'Round over', cell: (i, v) => `Cell ${i}${v ? ' ' + v : ', empty'}`,
    youWin: 'You won!', cpuWin: 'Computer wins', pWin: n => `${n} wins`, subWin: 'Nice game, keep going?', subLose: 'Try again or lower the level', subDraw: 'Nobody won this time',
    np: n => `${n} players`, roll: 'Roll dice', rolled: (n, v) => `${n} rolled ${v}`, extra: 'A 6! Roll again', snake: 'Snake! Down you go', ladder: 'Ladder! Up you go',
    exact: 'You need an exact roll to reach 100', sTurn: n => `${n}'s turn`, sHint: 'Reach 100 with an exact roll. A 6 gives another turn.', reach: 'Reached 100 first', ludo: 'Ludo', lPick: 'Pick a token to move', lNone: 'No move possible', lCap: 'Captured! Roll again', lHome: 'A token made it home! Roll again', setupT: 'Who is playing?', start: 'Start', human: 'Human', cpuB: 'Computer', lAll: 'Got all 4 tokens home', lHint: 'Roll a 6 to leave the base. Land on an opponent to send it back. Stars are safe.' },
  ar: { title: 'ليلة ألعاب', xo: 'إكس أو', snl: 'سلم وثعبان', two: 'لاعبين', cpu: 'ضد الكمبيوتر', easy: 'سهل', mid: 'متوسط', hard: 'مستحيل',
    draw: 'تعادل', undo: 'تراجع', next: 'جولة جديدة', clear: 'تصفير النتيجة', hint: 'تقدر تلعب بالكيبورد من 1 لـ 9', again: 'العب تاني',
    you: 'أنت', cpuN: 'الكمبيوتر', p: n => `لاعب ${n}`, yourTurn: 'دورك <i>X</i>', turnP: p => `دور اللاعب <i>${p}</i>`,
    think: 'الكمبيوتر بيفكر', over: 'الجولة خلصت', cell: (i, v) => `خانة ${i}${v ? ' ' + v : ' فاضية'}`,

  if (dlg.open) dlg.close();
  const n = LU.n;
  LU = { n, cols: n === 2 ? [0, 2] : n === 3 ? [0, 1, 2] : [0, 1, 2, 3], pos: Array.from({ length: n }, () => Array(4).fill(-1)), turn: 0, v: 0, phase: 'roll', busy: false, over: false, msg: '' };
  $('#ltoks').innerHTML = LU.pos.map((a, pl) => a.map((_, k) => `<button class="lt" id="lt${pl}_${k}" style="--c:${LC[LU.cols[pl]]}" aria-label="${nm(pl)}"></button>`).join('')).join('');
  document.querySelectorAll('.lt').forEach(e => e.onclick = () => lpick(+e.id[2], +e.id.slice(4)));
  $('#ldie').textContent = '?'; layout(); ludoRender();
}
const lmov = v => LU.pos[LU.turn].map((p, k) => p < 0 ? (v === 6 ? k : -1) : (p + v <= 56 ? k : -1)).filter(k => k >= 0);
function ludoRender() {
  $('#lN').querySelectorAll('button').forEach(b => { b.textContent = t('np', b.dataset.ln); b.setAttribute('aria-pressed', +b.dataset.ln === LU.n) });
  $('#lchips').style.gridTemplateColumns = `repeat(${LU.n},1fr)`;
  $('#lchips').innerHTML = LU.pos.map((A, i) => `<div class="sc${i === LU.turn && !LU.over ? ' pon' : ''}"><span class="who">${nm(i)}</span><b style="color:${LC[LU.cols[i]]}">${A.filter(q => q === 56).length}/4</b></div>`).join('');
  const can = LU.phase === 'pick' ? lmov(LU.v) : [];
  document.querySelectorAll('.lt').forEach(e => e.classList.toggle('can', +e.id[2] === LU.turn && can.includes(+e.id.slice(4))));
  const lt = $('#lturn');
  lt.textContent = LU.over ? t('over') : LU.phase === 'pick' ? t('lPick') : t('sTurn', nm(LU.turn));
  lt.style.color = LU.over ? 'var(--muted)' : LC[LU.cols[LU.turn]];
  $('#lmsg').textContent = LU.msg; $('#lHint').textContent = t('lHint');
  $('#lroll').textContent = t('roll'); $('#lroll').disabled = LU.busy || LU.over || LU.phase !== 'roll' || cfg.cpu[LU.turn];
}
async function lroll(auto) {
  if (LU.busy || LU.over || LU.phase !== 'roll' || (cfg.cpu[LU.turn] && auto !== true)) return;
  LU.busy = true; ludoRender();
  const die = $('#ldie'); die.classList.add('roll');
  let v = 1;
  for (let k = 0; k < 9; k++) { v = 1 + Math.random() * 6 | 0; die.textContent = v; beep(260 + v * 35, .05, 'square'); await sleep(75) }
  die.classList.remove('roll');
  LU.v = v; LU.msg = t('rolled', nm(LU.turn), v);
  let m = lmov(v);
  if (!m.length) { LU.msg = t('lNone'); ludoRender(); await sleep(900); return lnext(false) }
  if (m.every(k => LU.pos[LU.turn][k] < 0)) m = [m[0]];
  if (cfg.cpu[LU.turn]) { ludoRender(); await sleep(500); return lmove(lai(m)) }
  if (m.length === 1) { ludoRender(); await sleep(350); return lmove(m[0]) }
  LU.phase = 'pick'; LU.busy = false; ludoRender();
}
function lpick(pl, k) { if (LU.phase === 'pick' && pl === LU.turn && !cfg.cpu[pl] && lmov(LU.v).includes(k)) lmove(k) }
async function lmove(k) {
  LU.busy = true; LU.phase = 'roll'; ludoRender();
  const pl = LU.turn, P = LU.pos[pl], v = LU.v, ci = LU.cols[pl]; let cap = false;
  if (P[k] < 0) { P[k] = 0; beep(500, .1, 'triangle'); layout(); await sleep(300) }
  else for (let s = 0; s < v; s++) { P[k]++; beep(420 + P[k] % 10 * 15, .05, 'triangle'); layout(); await sleep(170) }
  const p = P[k], g = (ST[ci] + p) % 52;
  if (p <= 50 && !SAFE.includes(g)) {
    LU.pos.forEach((A, o) => { if (o !== pl) A.forEach((q, j) => { if (q >= 0 && q <= 50 && (ST[LU.cols[o]] + q) % 52 === g) { A[j] = -1; cap = true } }) });
    if (cap) { beep(160, .3, 'sawtooth'); layout(); await sleep(500) }
  }
  if (P.every(q => q === 56)) {
    LU.over = true; LU.busy = false; ludoRender();
    [523, 659, 784, 1047].forEach((f, j) => beep(f, .25, 'triangle', 150 + j * 120)); confetti();
    setTimeout(() => {
      $('#rMark').innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="${LC[ci]}" stroke="#fff" stroke-width="6"/></svg>`;
      $('#rTitle').textContent = t('pWin', nm(pl)); $('#rSub').textContent = t('lAll'); dlg.showModal();
    }, 900);
    return;
  }
  LU.msg = cap ? t('lCap') : p === 56 ? t('lHome') : v === 6 ? t('extra') : LU.msg;
  lnext(v === 6 || cap || p === 56);
}
function lnext(extra) {
  if (!extra) LU.turn = (LU.turn + 1) % LU.n;
  LU.busy = false; LU.phase = 'roll'; ludoRender(); ludoKick();
}
document.querySelectorAll('[data-ln]').forEach(b => b.onclick = () => { if (LU.busy) return; LU.n = +b.dataset.ln; ludoReset(); ask('ludo') });
$('#lroll').onclick = $('#ldie').onclick = lroll;

/* ---------- player setup and computer players ---------- */
const KICK = 800;
const nm = i => (cfg.names[i] || '').trim() || (cfg.cpu[i] ? `${t('cpuN')} ${i + 1}` : t('p', i + 1));
function snlKick() { if (cfg.game === 'snl' && !G.busy && !G.over && cfg.cpu[G.turn]) setTimeout(() => { if (cfg.game === 'snl' && cfg.cpu[G.turn]) roll(true) }, KICK) }
function ludoKick() { if (cfg.game === 'ludo' && !LU.busy && !LU.over && LU.phase === 'roll' && cfg.cpu[LU.turn]) setTimeout(() => { if (cfg.game === 'ludo' && cfg.cpu[LU.turn]) lroll(true) }, KICK) }
function lai(m) {
  const pl = LU.turn, ci = LU.cols[pl], v = LU.v; let best = m[0], bs = -1e9;
  for (const k of m) {
    const p = LU.pos[pl][k], q = p < 0 ? 0 : p + v, g = (ST[ci] + q) % 52; let s = q * .1 + Math.random();
    if (p < 0) s += 50;
    if (q === 56) s += 90;
    if (q <= 50) { if (SAFE.includes(g)) s += 25; else if (LU.pos.some((A, o) => o !== pl && A.some(x => x >= 0 && x <= 50 && (ST[LU.cols[o]] + x) % 52 === g))) s += 100 }
    else s += 15;
    if (s > bs) { bs = s; best = k }
  }
  return best;
}
let askGame, pendN;
function rows() {
  const cols = askGame === 'snl' ? PC : (pendN === 2 ? [0, 2] : pendN === 3 ? [0, 1, 2] : [0, 1, 2, 3]).map(c => LC[c]);
  $('#snN').querySelectorAll('button').forEach(b => { b.textContent = t('np', b.dataset.sn); b.setAttribute('aria-pressed', +b.dataset.sn === pendN) });
  $('#srows').innerHTML = Array.from({ length: pendN }, (_, i) => `<div class="srow"><i style="background:${cols[i]}"></i><input maxlength="14" value="${cfg.names[i] || ''}" placeholder="${t('p', i + 1)}" aria-label="${t('p', i + 1)}"><button class="tg" data-cpu="${cfg.cpu[i] ? 1 : 0}"></button></div>`).join('');
  const sync = b => b.textContent = +b.dataset.cpu ? '🤖 ' + t('cpuB') : '👤 ' + t('human');
  document.querySelectorAll('.tg').forEach(b => { sync(b); b.onclick = () => { b.dataset.cpu = 1 - b.dataset.cpu; sync(b) } });
}
function grab() {
  document.querySelectorAll('#srows .srow').forEach((r, i) => { cfg.names[i] = r.querySelector('input').value.replace(/[<>&"']/g, '').trim(); cfg.cpu[i] = !!+r.querySelector('.tg').dataset.cpu });
}
function ask(game) { askGame = game; pendN = game === 'snl' ? G.n : LU.n; rows(); $('#setup').showModal() }
$('#snN').querySelectorAll('button').forEach(b => b.onclick = () => { grab(); pendN = +b.dataset.sn; rows() });
$('#sgo').onclick = () => $('#setup').close();
$('#setup').addEventListener('close', () => {
  grab(); save();
  if (askGame === 'snl') { if (G.n !== pendN) { G.n = pendN; snlReset() } snlRender(); snlKick() }
  else { if (LU.n !== pendN) { LU.n = pendN; ludoReset() } ludoRender(); ludoKick() }
});

setGame(cfg.game);
</script>
